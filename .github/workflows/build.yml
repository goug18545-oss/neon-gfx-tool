
name: Build NEON GFX TOOL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk android-sdk-build-tools
          SDK_DIR=/usr/lib/android-sdk
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          AIDL_PATH=$(find "$SDK_DIR" -type f -name aidl -executable -print -quit)
          if [ -z "$AIDL_PATH" ]; then
            echo "AIDL NOT FOUND"
            exit 1
          fi
          echo "$(dirname "$AIDL_PATH")" >> "$GITHUB_PATH"
          echo "AIDL found: $AIDL_PATH"

      - name: Install dependencies
        run: |
          sudo apt-get install -y python3-pip python3-venv git zip unzip build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev

      - name: Build APK
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-GFX-TOOL-APK
          path: bin/*.apk
